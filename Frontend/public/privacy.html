<h1>ChunkMaster 隱私政策</h1>
<p>最後更新：2026-08-16</p>
<p>我們使用電子郵件提供帳號服務，並保存學習進度、偏好與你建立的筆記，以同步學習體驗。</p>
<p>密碼只保存雜湊；我們不出售個人資料。必要的託管、郵件、錯誤追蹤及大模型供應商只取得提供服務所需的最少資料。學習者的私人筆記不會傳送給大模型內容生成流程。</p>
<p>你可在帳號設定匯出或刪除資料。安全或法規要求的有限紀錄可能在合理期限內保留。</p>
<p>正式發布前，營運者應在此補上公司名稱、司法管轄區、資料保留期限及支援聯絡方式。</p>
